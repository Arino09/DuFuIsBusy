[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/LICENSE.txt,scripts/audio/wwise_web_audio_driver.js,addons/Wwise/wwise_project/DuFuIsBusy/audio_events.tsv,addons/Wwise/wwise_project/DuFuIsBusy/GeneratedSoundBanks/Web/*.bnk"
exclude_filter="docs/*,tools/*,tests/*,build/*,addons/Wwise/wwise_project/DuFuIsBusy/Originals/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"杜甫很忙：本地续画与趣味点评。\"><style>body{background:#f1ecdf!important}#status{background:#f1ecdf!important;color:#243d35!important}</style><script>/* Wwise Web needs SharedArrayBuffer; the PWA worker adds COOP/COEP, but Godot only reloads under it for threaded builds. */(function(){if(self.crossOriginIsolated||!('serviceWorker' in navigator))return;try{if(sessionStorage.getItem('dufu-coi-reload'))return;sessionStorage.setItem('dufu-coi-reload','1')}catch(e){return}navigator.serviceWorker.register('index.service.worker.js').then(function(){return navigator.serviceWorker.ready}).then(function(){location.reload()}).catch(function(e){console.warn('Cross-origin isolation unavailable; audio disabled.',e)})})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true

