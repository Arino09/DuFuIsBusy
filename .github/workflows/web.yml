name: Godot Web Preview
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dufu-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot 4.7.2 and matching templates
        run: bash tools/install-godot.sh
      - name: Install Wwise Linux editor dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtbb12
          if ldd addons/Wwise/native/lib/linux/editor/profile/libwwise.linux.editor.profile.so | grep 'not found'; then exit 1; fi
      - name: Import project
        run: godot --headless --editor --import --quit 2>&1 | tee import.log
      - name: Run scene smoke check
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' import.log smoke.log | grep -v 'ProjectInfo.json not found'; then exit 1; fi
      - name: Test drawing and editable object history
        run: |
          timeout 60s godot --headless --path . --script tests/drawing_test.gd 2>&1 | tee drawing-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' drawing-test.log; then exit 1; fi
          grep 'DRAWING_TESTS_PASSED' drawing-test.log
          timeout 60s godot --headless --path . --script tests/canvas_view_test.gd 2>&1 | tee canvas-view-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' canvas-view-test.log; then exit 1; fi
          grep 'CANVAS_VIEW_TESTS_PASSED' canvas-view-test.log
          timeout 60s godot --headless --path . --script tests/avatar_rotation_test.gd 2>&1 | tee handles-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' handles-test.log; then exit 1; fi
          grep 'AVATAR_ROTATION_TESTS_PASSED' handles-test.log
      - name: Test persistent layer serialization
        run: |
          timeout 60s godot --headless --path . --script tests/storage_test.gd 2>&1 | tee storage-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' storage-test.log; then exit 1; fi
          grep 'STORAGE_TESTS_PASSED' storage-test.log
      - name: Test authored UI scenes and interactions
        run: |
          timeout 60s godot --headless --path . --script tests/ui_scene_test.gd 2>&1 | tee ui-scene-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' ui-scene-test.log; then exit 1; fi
          grep 'UI_SCENE_TESTS_PASSED' ui-scene-test.log
          timeout 60s godot --headless --path . --script tests/resolution_test.gd 2>&1 | tee resolution-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' resolution-test.log; then exit 1; fi
          grep 'RESOLUTION_TESTS_PASSED' resolution-test.log
          timeout 60s godot --headless --path . --script tests/mobile_layout_test.gd 2>&1 | tee mobile-layout-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' mobile-layout-test.log; then exit 1; fi
          grep 'MOBILE_LAYOUT_TESTS_PASSED' mobile-layout-test.log
          timeout 60s godot --headless --path . --script tests/mobile_touch_test.gd 2>&1 | tee mobile-touch-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' mobile-touch-test.log; then exit 1; fi
          grep 'MOBILE_TOUCH_TESTS_PASSED' mobile-touch-test.log
          timeout 60s godot --headless --path . --script tests/mobile_pages_test.gd 2>&1 | tee mobile-pages-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' mobile-pages-test.log; then exit 1; fi
          grep 'mobile_pages_test: PASS' mobile-pages-test.log
          timeout 60s godot --headless --path . --script tests/mobile_scroll_test.gd 2>&1 | tee mobile-scroll-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' mobile-scroll-test.log; then exit 1; fi
          grep 'MOBILE_SCROLL_TESTS_PASSED' mobile-scroll-test.log
          timeout 60s godot --headless --path . --script tests/palette_test.gd 2>&1 | tee palette-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' palette-test.log; then exit 1; fi
          grep 'PALETTE_TESTS_PASSED' palette-test.log
      - name: Test draft encoding cache
        run: |
          timeout 60s godot --headless --path . --script tests/draft_cache_test.gd 2>&1 | tee draft-cache-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' draft-cache-test.log; then exit 1; fi
          grep 'DRAFT_CACHE_TESTS_PASSED' draft-cache-test.log
      - name: Test settings validation and authored content
        run: |
          timeout 60s godot --headless --path . --script tests/settings_test.gd 2>&1 | tee settings-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' settings-test.log; then exit 1; fi
          grep 'SETTINGS_TESTS_PASSED' settings-test.log
          timeout 60s godot --headless --path . --script tests/content_catalog_test.gd 2>&1 | tee content-catalog-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR):' content-catalog-test.log; then exit 1; fi
          grep 'CONTENT_CATALOG_TESTS_PASSED' content-catalog-test.log
      - name: Test audio routing and the shipped audio table
        run: |
          timeout 60s godot --headless --path . --script tests/audio_test.gd 2>&1 | tee audio-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR|AUDIO_TABLE_INVALID):' audio-test.log; then exit 1; fi
          grep 'AUDIO_TESTS_PASSED' audio-test.log
      - name: Test what the player hears in real scenes
        run: |
          timeout 60s godot --headless --path . --script tests/audio_flow_test.gd 2>&1 | tee audio-flow-test.log
          if grep -E '^(SCRIPT ERROR|Parse Error|ERROR)' audio-flow-test.log; then exit 1; fi
          grep 'AUDIO_FLOW_TESTS_PASSED' audio-flow-test.log
      - name: Export single-threaded Web
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html 2>&1 | tee export.log
          # The Wwise editor plugin wants ProjectInfo.json for its browser; runtime only needs the .bnk files.
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' export.log | grep -v 'ProjectInfo.json not found'; then exit 1; fi
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/index.side.wasm
          test -s build/web/libwwise.web.template_release.release.nothreads.wasm
          test -s build/web/WwiseAudioWorklet.processor.js
          grep -a -q 'GeneratedSoundBanks/Web/Init.bnk' build/web/index.pck
          grep -a -q 'GeneratedSoundBanks/Web/Main.bnk' build/web/index.pck
          touch build/web/.nojekyll
      - name: Preserve Web build
        uses: actions/upload-artifact@v4
        with:
          name: dufu-web
          path: build/web
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
